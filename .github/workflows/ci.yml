name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Snapshot is Emacs's development branch, so a red run there is news
    # rather than a broken build.
    continue-on-error: ${{ matrix.emacs == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        emacs: ['29.4', '30.1', 'snapshot']
    steps:
      - uses: actions/checkout@v5
      - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: ${{ matrix.emacs }}
      - run: make deps
      - run: make compile lint test

  # The oldest persp-mode that Package-Requires allows, and the oldest Emacs.
  oldest-persp-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: '29.4'
      - run: git clone --depth 1 --branch v3.0.8 https://github.com/Bad-ptr/persp-mode.el "$RUNNER_TEMP/persp-mode"
      - run: make compile test PERSP_MODE_DIR="$RUNNER_TEMP/persp-mode"

  # melpazoid ships as a workflow to copy rather than an action to use, so this
  # is its melpazoid.yml, pinned to a commit.
  melpazoid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install
        run: |
          sudo apt-get install emacs && emacs --version
          git clone https://github.com/riscy/melpazoid.git ~/melpazoid
          git -C ~/melpazoid checkout 7bc2a1a84e201f8783401fb051350a97ebf9d963
      - name: Run
        env:
          LOCAL_REPO: ${{ github.workspace }}
          RECIPE: (persp-mode-tab-bar :fetcher github :repo "Jotham-LEC/persp-mode-tab-bar")
          WARN_IS_ERROR: true
          EXIST_OK: false
        run: echo $GITHUB_REF && make -C ~/melpazoid
